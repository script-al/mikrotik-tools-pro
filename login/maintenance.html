<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode | ComitTools Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { orange: '#ff5c00', teal: '#3fd3c0' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-brand-orange/20 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-brand-teal/20 blur-[120px] rounded-full pointer-events-none"></div>

    <div class="max-w-lg w-full glass-panel p-8 rounded-2xl border border-white/10 text-center shadow-2xl relative z-10 space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-orange/20 flex items-center justify-center text-brand-orange text-3xl">
            <i class="fa-solid fa-wrench"></i>
        </div>

        <h1 class="text-3xl font-extrabold text-white">Under Maintenance</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            Sistem sedang dalam proses pemeliharaan dan pembaruan database RouterOS v7. Kami akan segera kembali beroperasi normal.
        </p>

        <!-- Countdown timer -->
        <div class="grid grid-cols-3 gap-3">
            <div class="p-3 bg-white/5 rounded-xl border border-white/10">
                <span id="hours" class="text-2xl font-bold text-brand-orange font-mono">01</span>
                <span class="block text-[11px] text-slate-400">Jam</span>
            </div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/10">
                <span id="minutes" class="text-2xl font-bold text-brand-teal font-mono">45</span>
                <span class="block text-[11px] text-slate-400">Menit</span>
            </div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/10">
                <span id="seconds" class="text-2xl font-bold text-white font-mono">30</span>
                <span class="block text-[11px] text-slate-400">Detik</span>
            </div>
        </div>

        <div class="pt-2">
            <a href="../index.html" class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white font-semibold px-6 py-3 rounded-xl transition border border-white/10">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        let timeLeft = 6330;
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                const h = Math.floor(timeLeft / 3600);
                const m = Math.floor((timeLeft % 3600) / 60);
                const s = timeLeft % 60;
                document.getElementById('hours').innerText = String(h).padStart(2, '0');
                document.getElementById('minutes').innerText = String(m).padStart(2, '0');
                document.getElementById('seconds').innerText = String(s).padStart(2, '0');
            }
        }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFig Skin & Branding Generator | ComitTools Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/app.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { orange: '#ff5c00', teal: '#3fd3c0' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between glass-panel p-4 rounded-xl border border-white/10">
            <div class="flex items-center gap-3">
                <a href="../../index.html" class="text-slate-400 hover:text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Home
                </a>
                <span class="text-slate-600">|</span>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-palette text-brand-orange"></i> WebFig Skin & Branding Generator
                </h1>
            </div>
            <span class="text-xs font-mono bg-brand-orange/20 text-brand-orange px-3 py-1 rounded-full border border-brand-orange/30">RouterOS v6 & v7</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Form Config -->
            <div class="glass-panel p-6 rounded-2xl border border-white/10 space-y-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2 border-b border-white/10 pb-3">
                    <i class="fa-solid fa-sliders text-brand-teal"></i> Custom Branding Settings
                </h2>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Router Identity / Hostname</label>
                    <input type="text" id="routerIdentity" value="MikroTik-Comit-Router" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-orange">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">ISP / Company Brand Name</label>
                    <input type="text" id="companyName" value="Comit Network Solutions" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-orange">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Support Contact / WhatsApp</label>
                    <input type="text" id="contactInfo" value="+62 851-6138-6700 | NOC 24/7" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-orange">
                </div>

                <div class="space-y-2 pt-2">
                    <label class="block text-xs font-semibold text-slate-300">Security & Menu Lockdown (For Client Access)</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center gap-2 p-2 bg-black/20 rounded border border-white/5 cursor-pointer">
                            <input type="checkbox" id="hideTerminal" checked class="accent-brand-orange"> Hide New Terminal
                        </label>
                        <label class="flex items-center gap-2 p-2 bg-black/20 rounded border border-white/5 cursor-pointer">
                            <input type="checkbox" id="hideReset" checked class="accent-brand-orange"> Hide Reset Config
                        </label>
                        <label class="flex items-center gap-2 p-2 bg-black/20 rounded border border-white/5 cursor-pointer">
                            <input type="checkbox" id="hideUsers" checked class="accent-brand-orange"> Hide User Accounts
                        </label>
                        <label class="flex items-center gap-2 p-2 bg-black/20 rounded border border-white/5 cursor-pointer">
                            <input type="checkbox" id="hideFiles" checked class="accent-brand-orange"> Hide File Manager
                        </label>
                    </div>
                </div>

                <button onclick="generateWebfigSkin()" class="w-full bg-brand-orange hover:bg-[#e04d00] text-white font-bold py-3 rounded-lg transition shadow-lg mt-4 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate RouterOS Script
                </button>
            </div>

            <!-- Preview / Output -->
            <div class="glass-panel p-6 rounded-2xl border border-white/10 flex flex-col">
                <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-brand-orange"></i> Terminal Script (.rsc)
                    </h2>
                    <div class="flex items-center gap-2">
                        <button onclick="copyOutput()" class="text-xs bg-white/10 hover:bg-white/20 text-slate-200 px-3 py-1.5 rounded transition flex items-center gap-1">
                            <i class="fa-solid fa-copy"></i> Copy
                        </button>
                        <button onclick="downloadRSC()" class="text-xs bg-brand-teal/20 hover:bg-brand-teal/30 text-brand-teal px-3 py-1.5 rounded transition flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> Download
                        </button>
                    </div>
                </div>

                <textarea id="scriptOutput" readonly class="w-full flex-1 min-h-[300px] bg-black/50 border border-white/10 rounded-xl p-4 font-mono text-xs text-brand-teal focus:outline-none resize-none leading-relaxed"></textarea>

                <div class="mt-4 p-3 rounded-lg bg-white/5 border border-white/5 text-xs text-slate-400">
                    <i class="fa-solid fa-circle-info text-brand-orange mr-1"></i>
                    Buka Winbox, klik <b>New Terminal</b>, lalu paste script di atas untuk menerapkan identitas router dan banner branding secara instan.
                </div>
            </div>
        </div>

    </div>

    <script>
        function generateWebfigSkin() {
            const identity = document.getElementById('routerIdentity').value || 'MikroTik-Router';
            const company = document.getElementById('companyName').value || 'Comit Network';
            const contact = document.getElementById('contactInfo').value || 'Support Center';
            const hideTerm = document.getElementById('hideTerminal').checked;
            const hideRst = document.getElementById('hideReset').checked;
            const hideUsr = document.getElementById('hideUsers').checked;
            const hideFil = document.getElementById('hideFiles').checked;

            let script = `# ====================================================\n`;
            script += `# RouterOS System Identity & Branding Script\n`;
            script += `# Created via ComitTools Pro WebFig Skin Generator\n`;
            script += `# ====================================================\n\n`;

            script += `/system identity set name="${identity}"\n\n`;

            script += `/system note\n`;
            script += `set note="****************************************************\\r\\\n`;
            script += `           ${company.toUpperCase()}\\r\\\n`;
            script += `           Identity : ${identity}\\r\\\n`;
            script += `           Contact  : ${contact}\\r\\\n`;
            script += `****************************************************" show-at-login=yes\n\n`;

            script += `# --- Restricted Group For Client / Operator Access ---\n`;
            let policy = ['read', 'test', 'winbox', 'web'];
            if (!hideTerm) policy.push('local');
            if (!hideUsr) policy.push('policy');
            if (!hideFil) policy.push('ftp');

            script += `/user group add name=client_readonly policy=${policy.join(',')} comment="Safe operator access"\n`;
            script += `/user add name=operator group=client_readonly password="ChangeMe123!" comment="Limited operator user"\n\n`;

            if (hideRst) {
                script += `# Protection Note: Reset command is disabled for 'client_readonly' group by omitting write/policy privileges.\n`;
            }

            script += `# ====================================================\n`;
            script += `# SCRIPT FINISHED - ENJOY SECURE BRANDED ROUTEROS\n`;

            document.getElementById('scriptOutput').value = script;
        }

        function copyOutput() {
            const ta = document.getElementById('scriptOutput');
            navigator.clipboard.writeText(ta.value).then(() => {
                alert('Script berhasil disalin ke clipboard!');
            });
        }

        function downloadRSC() {
            const content = document.getElementById('scriptOutput').value;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'branding_identity.rsc';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Run once on load
        generateWebfigSkin();
    </script>
</body>
</html>
